name: Offline demo checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m cdr_skill.demo --output artifacts/demo_report.json
      - uses: actions/upload-artifact@v4
        with:
          name: offline-demo-report
          path: artifacts/
