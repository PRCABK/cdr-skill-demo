name: Offline demo checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    # 固定运行镜像，避免默认镜像自动迁移影响复现。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m cdr_skill.demo --output artifacts/demo_report.json
      - uses: actions/upload-artifact@v7
        with:
          name: offline-demo-report
          path: artifacts/
